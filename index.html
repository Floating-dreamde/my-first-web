<!DOCTYPE html>
<html>
<head>
    <title>我的第一个网页</title>

    <style>
        body {
            background-color: #111;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            margin-top: 100px;
            font-size: 50px;
        }

        p {
            font-size: 22px;
            color: #ccc;
        }

        button {
            background-color: white;
            color: black;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: gray;
        }
    </style>

</head>

<body>

<h1>你好，世界！</h1>

<p>
这是我的第一个网页 🚀
</p >

<button onclick="alert('欢迎来到我的网站！')">
点击我
</button>

</body>
</html>
