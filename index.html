<!DOCTYPE html>
<html>
<head>
    <title>我的个人主页</title>

    <style>
        body {
            background: #111;
            color: white;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        h1 {
            font-size: 60px;
        }

        p {
            font-size: 20px;
            color: #aaa;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }
        .avatar{
            width:150px;
            height:150px;
            object-fit:cover;
            border-radius: 50%;
        }
        nav{
            background-color:#222;
            padding:20px;
            margin-bottom:40px;
        }
        nav a{
            color:white;
            text-decoration:none;
            margin:0 20px;
            font-size:18px;
            cursor:pointer;
        }
        nav a:hover{
            color:#00aaff;
        }
        .projects{
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .project-card{
            background: #222;
            width: 250px;
            padding: 25px;
            border-radius: 15px;
            transform: translateY(0);
            transition: transform 0.5s;
        }
        .project-card:hover{transform: translateY(-20px);
        }
        .project-card h3{font-size: 24px;
        }
        .project-card p{font-size: 16px;
        }
        section{
            padding: 100px 20px;
        }
    </style>
</head>

<body>
    <nav>
        <a href="#">首页</a>
        <a href="#about">关于我</a>

    </section>

    <h1>我是一个正在学习编程的人</h1>

<p>欢迎来到我的个人主页</p>

<p>
    我正在学习 HTML、CSS、JavaScript 和 Python。
</p>
<p>我的兴趣是研究AI和网络技术</p>

<button onclick="alert('欢迎来到我的网站！')">
    关于我
</button>

<button onclick="alert('我的网站正在建设中！')">

</html>
