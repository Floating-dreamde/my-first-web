<!DOCTYPE html>
<html>
<head>
    <title>我的个人主页</title>

    <style>
        body {
            background: #111;
            color: white;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        h1 {
            font-size: 60px;
        }

        p {
            font-size: 20px;
            color: #aaa;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }
        .avatar{
            width:150px;
            height:150px;
            object-fit:cover;
            border-radius: 50%;
        }
        nav{
            background-color:#222;
            padding:20px;
            margin-bottom:40px;
        }
        nav a{
            color:white;
            text-decoration:none;
            margin:0 20px;
            font-size:18px;
            cursor:pointer;
        }
        nav a:hover{
            color:#00aaff;
        }
        .projects{
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .project-card{
            background: #222;
            width: 250px;
            padding: 25px;
            border-radius: 15px;
            transform: translateY(0);
            transition: transform 0.5s;
        }
        .project-card:hover{transform: translateY(-20px);
        }
        .project-card h3{font-size: 24px;
        }
        .project-card p{font-size: 16px;
        }
        section{
            padding: 100px 20px;
        }
        .project-card a{
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #00aaff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
        .project-card a:hover{
            background: #0088cc;
        }
        form{
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: #222;
            border-radius: 15px;
        }
        form label{
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }
        form input,form textarea,form select{
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 8px;
            border: none;
        }
        form button{
            margin-top: 25px;
            width: 100%;
        }
    </style>
</head>

<body>
    <nav>
        <a href="#home">首页</a>
        <a href="#about">关于我</a>
        <a href="#projects">我的项目</a>
        <a href="#contact">联系我</a>
    </nav>
    <img src="pvz.png" width="150" class="avatar">
   
    <section id="home">
    <h1>我是一个正在学习编程的人</h1>

    <p>欢迎来到我的个人主页</p>

<p>
    我正在学习 HTML、CSS、JavaScript 和 Python。
</p>
<p>我的兴趣是研究AI和网络技术</p>
    </section>
     <section id="about">
        <h2>关于我</h2>
        <p>我正在学习网页制作。</p>
        <p>目前正在学习 HTML、CSS、JavaScript 和 Python。</p>
        <p>我希望以后能够自己制作完整的网站。</p>
    </section>

<button onclick="alert('欢迎来到我的网站！')">
    关于我
</button>

<button onclick="alert('我的网站正在建设中！')">
    我的项目
</button>
<h2 id="projects">我的项目</h2>
<div class="projects">
    <div class="project-card">
        <h3>我的第一个网站</h3>
        <p> 这是我学习HTML和CSS制作的第一个网站</p>
        <a href="https://github.com/" target="_blank">查看项目</a>
    </div>
        <div class="project-card">
            <h3>我的第二个项目</h3>
            <p>这个项目正在制作中，敬请期待</p>
        </div>
</div>
<section id="contact">
        <h2>联系我</h2>
        <form>
            <label for="name">姓名</label>
            <input type="text" id="name" placeholder="请输入您的姓名（网名也可以哦）" required>

            <label for="email">邮箱</label>
            <input type="email" id="email" placeholder="请输入您的邮箱" required>

            <label for="tel">电话号码</label>
            <input type="tel" id="tel" placeholder="请输入您的电话号码">

            <label for="type">咨询类型</label>
            <select id="type">
                <option>网站开发</option>
                <option>网页设计</option>
                <option>JavaScript</option>
                <option>其他</option>
            </select>
            
            <label for="massage">留言</label>
            <textarea id="massage" placeholder="畅所欲言吧！"></textarea>

            <button type="submit">提交</button>
        </form>
</section>
</body>
</html>
